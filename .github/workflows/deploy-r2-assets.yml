name: Deploy FE assets to R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/r2-asset-automation

concurrency:
  group: deploy-fe-assets-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      VITE_CDN_HOST: ${{ vars.VITE_CDN_HOST || secrets.CDN_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload plugin assets
        run: |
          test -n "$R2_ENDPOINT_URL"
          test -n "$R2_BUCKET_NAME"
          aws s3 sync dist "s3://$R2_BUCKET_NAME/plugin" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "asset-manifest.json"
          aws s3 cp dist/asset-manifest.json "s3://$R2_BUCKET_NAME/plugin/asset-manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --cache-control "public, max-age=60"

      - name: Upload default R2 assets
        run: |
          if [ -d assets/r2 ]; then
            aws s3 sync assets/r2 "s3://$R2_BUCKET_NAME" \
              --endpoint-url "$R2_ENDPOINT_URL" \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Verify upload
        run: |
          aws s3 ls "s3://$R2_BUCKET_NAME/plugin/" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --recursive \
            --summarize
